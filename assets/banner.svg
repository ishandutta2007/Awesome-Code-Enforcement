<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .grid-line { stroke: #334155; stroke-opacity: 0.3; stroke-width: 1; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-circle { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .animated-card { animation: float 4s infinite ease-in-out; }
    .animated-flow { stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)"/>

  <!-- Background Decorative Grid -->
  <g opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="300" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="300" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="300" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="300" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="300" class="grid-line"/>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line"/>
    <line x1="0" y1="150" x2="1200" y2="150" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
  </g>

  <!-- Dynamic Animated Background Glow Circles (Behind Text) -->
  <circle cx="150" cy="150" r="140" fill="#0284c7" opacity="0.15" class="animated-bg-circle"/>
  <circle cx="1050" cy="150" r="160" fill="#6366f1" opacity="0.15" class="animated-bg-circle" style="animation-delay: -3s;"/>

  <!-- Dynamic Flow Diagram Elements (Right Side Graphic - Clear of Main Text) -->
  <g transform="translate(820, 65)" class="animated-card">
    <rect width="320" height="170" rx="12" fill="url(#card-gradient)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Flow Nodes -->
    <rect x="25" y="30" width="80" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="52" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Citizen Intake</text>
    
    <rect x="145" y="30" width="80" height="35" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="185" y="52" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Triage & Case</text>
    
    <rect x="215" y="105" width="85" height="35" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="257" y="127" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Inspection</text>

    <rect x="75" y="105" width="85" height="35" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="117" y="127" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Resolution</text>

    <!-- Animated Connecting Paths -->
    <path d="M 105 47 L 145 47" stroke="#38bdf8" stroke-width="2" class="animated-flow"/>
    <path d="M 185 65 L 185 85 L 257 85 L 257 105" fill="none" stroke="#818cf8" stroke-width="2" class="animated-flow"/>
    <path d="M 215 122 L 160 122" fill="none" stroke="#c084fc" stroke-width="2" class="animated-flow"/>
  </g>

  <!-- Title Pill / Category Badge -->
  <g transform="translate(60, 50)">
    <rect width="260" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="130" y="20" class="badge-text" text-anchor="middle">GOVTECH &amp; CIVIC TECH ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp and Unobstructed) -->
  <text x="60" y="130" class="title">
    Awesome Code Enforcement <tspan fill="url(#accent-gradient)">🚀</tspan>
  </text>

  <text x="60" y="175" class="subtitle">
    Municipal Code Compliance, Case Management, Inspections &amp; Open311 🏢📋
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="60" y="225" width="680" height="4" rx="2" fill="url(#accent-gradient)"/>
</svg>
