<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-gradient" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient></defs><style>@keyframes pulseGlow{0%{opacity:.2;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text,.node-text,.subtitle{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-text{font-weight:700;font-size:13px;fill:#38bdf8;letter-spacing:.5px}.node-text{font-weight:600;font-size:12px;fill:#f8fafc}.grid-line{stroke:#334155;stroke-opacity:.25;stroke-width:1}.animated-bg-circle{animation:pulseGlow 5s infinite ease-in-out;transform-box:fill-box;transform-origin:center}.animated-card{animation:floatCard 4s infinite ease-in-out}.animated-flow{stroke-dasharray:6 4;animation:dashFlow 1.5s linear infinite}</style><rect width="1200" height="300" fill="url(#bg-gradient)" rx="16"/><g opacity=".4"><line x1="100" x2="100" y1="0" y2="300" class="grid-line"/><line x1="300" x2="300" y1="0" y2="300" class="grid-line"/><line x1="500" x2="500" y1="0" y2="300" class="grid-line"/><line x1="700" x2="700" y1="0" y2="300" class="grid-line"/><line x1="900" x2="900" y1="0" y2="300" class="grid-line"/><line x1="1100" x2="1100" y1="0" y2="300" class="grid-line"/><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="150" y2="150" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/></g><circle cx="200" cy="150" r="140" fill="#0284c7" class="animated-bg-circle" opacity=".25"/><circle cx="1000" cy="150" r="160" fill="#6366f1" class="animated-bg-circle" opacity=".25" style="animation-delay:-2.5s"/><g class="animated-card" transform="translate(800, 60)"><rect width="340" height="180" fill="url(#card-gradient)" stroke="#475569" stroke-width="1.5" rx="12"/><g transform="translate(25, 30)"><rect width="120" height="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/><text x="60" y="23" class="node-text" text-anchor="middle">Citizen Intake (311)</text></g><g transform="translate(195, 30)"><rect width="120" height="38" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="6"/><text x="60" y="23" class="node-text" text-anchor="middle">Triage &amp; Case</text></g><g transform="translate(195, 112)"><rect width="120" height="38" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="6"/><text x="60" y="23" class="node-text" text-anchor="middle">Field Inspection</text></g><g transform="translate(25, 112)"><rect width="120" height="38" fill="#1e293b" stroke="#34d399" stroke-width="1.5" rx="6"/><text x="60" y="23" class="node-text" text-anchor="middle">Resolution &amp; Fee</text></g><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 145 49 L 195 49" class="animated-flow"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 255 68 L 255 112" class="animated-flow"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 195 131 L 145 131" class="animated-flow"/></g><g transform="translate(60, 50)"><rect width="270" height="32" fill="#0369a1" fill-opacity=".3" stroke="#38bdf8" stroke-width="1.2" rx="16"/><text x="135" y="21" class="badge-text" text-anchor="middle">GOVTECH &amp; CIVIC TECH ECOSYSTEM</text></g><text x="60" y="132" class="title">Awesome Code Enforcement</text><text x="60" y="175" class="subtitle">Municipal Code Compliance, Case Management &amp; Open311 Ecosystem</text><rect width="660" height="4" x="60" y="215" fill="url(#accent-gradient)" rx="2"/></svg>